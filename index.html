<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 趣味打字大冒险 - 儿童打字游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Comic Sans MS', 'Chalkboard SE', 'STHupo', cursive, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  user-select: none;
}

#app {
  width: 800px;
  max-width: 95vw;
  height: 650px;
  max-height: 95vh;
  background: linear-gradient(180deg, #fff9e6 0%, #ffe8f0 40%, #e8f4fd 100%);
  border-radius: 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.5);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* floating decoration */
.clouds {
  position: absolute;
  top: 0; left: 0; right: 0;
  pointer-events: none;
  z-index: 0;
}
.cloud {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.6;
  animation: floatCloud 20s linear infinite;
}
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: white;
  border-radius: 50%;
}
.cloud:nth-child(1) { width: 80px; height: 40px; top: 20px; left: 10%; animation-delay: 0s; }
.cloud:nth-child(1)::before { width: 40px; height: 40px; top: -20px; left: 15px; }
.cloud:nth-child(1)::after { width: 50px; height: 50px; top: -25px; left: 35px; }
.cloud:nth-child(2) { width: 100px; height: 45px; top: 50px; right: 15%; animation-delay: -7s; }
.cloud:nth-child(2)::before { width: 50px; height: 50px; top: -25px; left: 20px; }
.cloud:nth-child(2)::after { width: 55px; height: 55px; top: -28px; left: 50px; }
.cloud:nth-child(3) { width: 70px; height: 35px; top: 80px; left: 55%; animation-delay: -14s; }
.cloud:nth-child(3)::before { width: 35px; height: 35px; top: -18px; left: 12px; }
.cloud:nth-child(3)::after { width: 40px; height: 40px; top: -22px; left: 30px; }

@keyframes floatCloud {
  0% { transform: translateX(-120px); }
  100% { transform: translateX(calc(100vw + 120px)); }
}

/* screens */
.screen {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  padding: 30px;
}
.screen.active { display: flex; }

/* start screen */
#screen-start .title {
  font-size: 52px;
  font-weight: bold;
  background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 3s ease infinite;
  text-shadow: none;
  margin-bottom: 10px;
}
@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

#screen-start .subtitle {
  font-size: 20px;
  color: #7c5cbf;
  margin-bottom: 20px;
}

.library-selector {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  font-size: 18px;
  color: #5a3e85;
  font-weight: bold;
}
.library-selector select {
  padding: 8px 16px;
  font-size: 17px;
  font-family: inherit;
  border: 2px solid #dfe6e9;
  border-radius: 20px;
  background: white;
  color: #5a3e85;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}
.library-selector select:focus {
  border-color: #ff9ff3;
}
#screen-start .mascot {
  font-size: 100px;
  animation: bounce 1s ease-in-out infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

.btn {
  padding: 16px 50px;
  font-size: 22px;
  font-family: inherit;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  color: white;
  font-weight: bold;
  letter-spacing: 2px;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
}
.btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
.btn:active { transform: translateY(3px); }

.btn-start {
  background: linear-gradient(135deg, #ff6b6b, #ee5a24);
  font-size: 28px;
  padding: 18px 60px;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0.6); }
  50% { box-shadow: 0 0 0 25px rgba(255,107,107,0); }
}

.btn-next {
  background: linear-gradient(135deg, #48dbfb, #0abde3);
}
.btn-bonus {
  background: linear-gradient(135deg, #feca57, #ff9f43);
}
.btn-retry {
  background: linear-gradient(135deg, #ff6b6b, #ee5a24);
}

/* game screen */
#screen-game { justify-content: flex-start; padding: 15px 20px; }

.game-header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
  background: rgba(255,255,255,0.7);
  border-radius: 30px;
  margin-bottom: 10px;
  z-index: 5;
}

.header-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  color: #5a3e85;
  font-weight: bold;
}
.header-item .icon { font-size: 24px; }

.hearts { display: flex; gap: 3px; }
.heart {
  font-size: 22px;
  transition: all 0.3s;
}
.heart.lost { opacity: 0.2; transform: scale(0.7); filter: grayscale(1); }

.combo-display {
  background: linear-gradient(135deg, #feca57, #ff9f43);
  color: white;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 16px;
  animation: comboBounce 0.3s ease;
  display: none;
}
.combo-display.show { display: block; }
@keyframes comboBounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.3); }
}

.progress-bar-wrap {
  width: 100%;
  height: 12px;
  background: rgba(255,255,255,0.6);
  border-radius: 10px;
  margin-bottom: 10px;
  overflow: hidden;
  z-index: 5;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #48dbfb, #0abde3, #00d2d3);
  border-radius: 10px;
  transition: width 0.5s ease;
}

/* game area */
.game-area {
  flex: 1;
  width: 100%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.word-bubble {
  position: absolute;
  background: radial-gradient(circle at 30% 30%, white, #ffe8f0);
  border: 4px solid #ff9ff3;
  border-radius: 50%;
  width: 180px;
  height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: bold;
  color: #5a3e85;
  box-shadow: 0 10px 30px rgba(255,107,107,0.3), inset 0 -5px 15px rgba(255,107,107,0.1);
  animation: bubbleAppear 0.5s ease, floatBubble 3s ease-in-out infinite;
  cursor: default;
  transition: transform 0.1s;
}
.word-bubble.shake {
  animation: bubbleShake 0.5s ease;
}
.word-bubble.pop {
  animation: bubblePop 0.4s ease forwards;
}
.word-bubble.timeout {
  animation: bubbleFadeOut 0.5s ease forwards;
}

.bubble-word {
  display: block;
  font-weight: bold;
  color: #5a3e85;
  text-shadow: 1px 1px 0 rgba(255,255,255,0.8);
  z-index: 1;
}
.bubble-phonetic {
  display: block;
  color: #9b59b6;
  font-family: 'Georgia', 'Times New Roman', serif;
  margin-top: 2px;
  z-index: 1;
}
.bubble-chinese {
  display: block;
  color: #e17055;
  margin-top: 1px;
  z-index: 1;
}
.bubble-speaker {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #ff9ff3;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
  cursor: pointer;
  margin-top: 4px;
  line-height: 1;
  transition: transform 0.15s, background 0.15s;
  z-index: 1;
  padding: 0;
}
.bubble-speaker:hover {
  transform: scale(1.15);
  background: #ffe8f0;
}
.bubble-speaker:active {
  transform: scale(0.9);
}

@keyframes bubbleAppear {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes floatBubble {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
@keyframes bubbleShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
@keyframes bubblePop {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.5; }
  100% { transform: scale(0); opacity: 0; }
}
@keyframes bubbleFadeOut {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0.5) translateY(-100px); opacity: 0; }
}

.timer-ring {
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  height: 8px;
  background: rgba(255,255,255,0.5);
  border-radius: 4px;
  overflow: hidden;
}
.timer-ring-fill {
  height: 100%;
  background: linear-gradient(90deg, #48dbfb, #ff6b6b);
  border-radius: 4px;
  transition: width 0.1s linear;
}

/* typing area */
.typing-area {
  width: 100%;
  max-width: 500px;
  z-index: 5;
  position: relative;
}
.typing-display {
  background: white;
  border: 3px solid #dfe6e9;
  border-radius: 25px;
  padding: 8px 20px;
  font-size: 24px;
  font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
  text-align: center;
  color: #5a3e85;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 4px;
  transition: border-color 0.2s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}
.typing-display:focus-within {
  border-color: #ff9ff3;
  box-shadow: 0 4px 20px rgba(255,159,243,0.3);
}
.typing-display .typed {
  color: #48dbfb;
}
.typing-display .remaining {
  color: #b2bec3;
}
.typing-display .cursor {
  animation: blink 0.8s step-end infinite;
  color: #ff6b6b;
  font-weight: bold;
}
@keyframes blink {
  50% { opacity: 0; }
}

.hint-text {
  text-align: center;
  color: #b2bec3;
  font-size: 12px;
  margin-top: 4px;
}
.hidden-input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

/* character at bottom */
.character-area {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 40px;
  z-index: 1;
  animation: characterIdle 2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes characterIdle {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-5px); }
}

/* level complete */
#screen-level-complete { z-index: 15; }
.level-complete-stars {
  font-size: 60px;
  margin: 20px 0;
}
.level-complete-stars .star {
  display: inline-block;
  animation: starPop 0.5s ease backwards;
}
.level-complete-stars .star:nth-child(1) { animation-delay: 0.2s; }
.level-complete-stars .star:nth-child(2) { animation-delay: 0.5s; }
.level-complete-stars .star:nth-child(3) { animation-delay: 0.8s; }
@keyframes starPop {
  0% { transform: scale(0) rotate(-180deg); opacity: 0; }
  60% { transform: scale(1.3) rotate(10deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.level-message {
  font-size: 36px;
  color: #5a3e85;
  font-weight: bold;
  margin: 10px 0;
}
.level-detail {
  font-size: 18px;
  color: #7c5cbf;
  margin-bottom: 20px;
}

/* mini game */
#screen-mini-game { z-index: 15; }
.mini-title {
  font-size: 32px;
  color: #ff6b6b;
  font-weight: bold;
  margin-bottom: 10px;
}
.mini-timer {
  font-size: 48px;
  color: #feca57;
  font-weight: bold;
  margin: 10px 0;
}
.mini-area {
  width: 100%;
  flex: 1;
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  background: linear-gradient(180deg, #1e2a4a 0%, #2d3e6b 100%);
  margin: 10px 0;
}
.mini-star {
  position: absolute;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, #feca57, #ff9f43);
  border: 2px solid #fff;
  color: #fff;
  font-size: 22px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: starFall linear forwards;
  box-shadow: 0 4px 15px rgba(254,202,87,0.6);
  text-transform: uppercase;
}
.mini-star::after {
  content: '⭐';
  position: absolute;
  font-size: 14px;
  top: -8px;
  right: -4px;
}
.mini-star.caught {
  animation: starCaught 0.3s ease forwards;
}
@keyframes starFall {
  0% { transform: translateY(-60px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(550px) rotate(360deg); opacity: 0.6; }
}
@keyframes starCaught {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(2.5) translateY(-30px); opacity: 0; }
}
.pause-btn {
  background: rgba(255,255,255,0.15);
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 12px;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  padding: 2px 10px;
  line-height: 1;
  transition: all 0.2s;
  margin-left: 4px;
}
.pause-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.08); }
.pause-btn:active { transform: scale(0.95); }

.mini-score {
  font-size: 28px;
  color: #feca57;
  font-weight: bold;
}

/* victory screen */
#screen-victory { z-index: 15; }
.victory-title {
  font-size: 48px;
  font-weight: bold;
  background: linear-gradient(135deg, #feca57, #ff9f43, #ff6b6b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 2s ease infinite;
}
.victory-mascot { font-size: 120px; animation: bounce 0.6s ease-in-out infinite; }
.total-score { font-size: 32px; color: #5a3e85; font-weight: bold; margin: 10px 0; }

/* particles */
.particle {
  position: absolute;
  pointer-events: none;
  z-index: 20;
  animation: particleFly 0.8s ease-out forwards;
}
@keyframes particleFly {
  0% { transform: translate(0, 0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
}

.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  pointer-events: none;
  z-index: 20;
  animation: confettiFall 3s ease-out forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(700px) rotate(720deg); opacity: 0; }
}

/* floating score */
.float-score {
  position: absolute;
  pointer-events: none;
  z-index: 25;
  font-size: 28px;
  font-weight: bold;
  color: #feca57;
  animation: floatUp 1s ease-out forwards;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}
@keyframes floatUp {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-80px); opacity: 0; }
}

/* on-screen keyboard */
.keyboard {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  z-index: 5;
  padding: 4px 0 0 0;
}
.keyboard-row {
  display: flex;
  gap: 3px;
}
.key {
  width: 32px;
  height: 36px;
  border-radius: 8px;
  background: linear-gradient(180deg, #fafafa 0%, #e8e8e8 100%);
  border: 2px solid #d0d0d0;
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  color: #666;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  box-shadow: 0 3px 6px rgba(0,0,0,0.1);
  text-transform: lowercase;
}
.key.highlight {
  background: linear-gradient(180deg, #ffe66d 0%, #feca57 100%);
  border-color: #ff9f43;
  color: #d63031;
  transform: scale(1.18);
  box-shadow: 0 0 16px rgba(254,202,87,0.7);
  animation: keyGlow 0.6s ease-in-out infinite;
}
@keyframes keyGlow {
  0%, 100% { box-shadow: 0 0 10px rgba(254,202,87,0.5); }
  50% { box-shadow: 0 0 22px rgba(254,202,87,0.9); }
}
.key.correct {
  background: linear-gradient(180deg, #a0f0c0 0%, #48dbb4 100%);
  border-color: #00b894;
  color: #fff;
  transform: scale(0.95);
}
.key.wrong-flash {
  background: linear-gradient(180deg, #ff7675 0%, #d63031 100%);
  border-color: #b71c1c;
  color: #fff;
  animation: keyShake 0.3s ease;
}
@keyframes keyShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

/* responsive */
@media (max-width: 600px) {
  #app { height: 550px; border-radius: 25px; }
  #screen-start .title { font-size: 32px; }
  #screen-start .mascot { font-size: 70px; }
  .word-bubble { width: 140px; height: 140px; font-size: 26px; }
  .btn { padding: 12px 35px; font-size: 18px; }
  .btn-start { font-size: 22px; }
  .game-header { padding: 8px 12px; }
  .header-item { font-size: 14px; }
  .typing-display { font-size: 22px; padding: 10px 15px; }
  .level-message { font-size: 26px; }
  .victory-title { font-size: 32px; }
}
</style>
</head>
<body>

<div id="app">
  <!-- clouds decoration -->
  <div class="clouds">
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
  </div>

  <!-- Start Screen -->
  <div id="screen-start" class="screen active">
    <div class="title">🌟 趣味打字大冒险 🌟</div>
    <div class="subtitle">和小动物一起学打字吧！</div>
    <div class="mascot">🦊</div>
    <div class="library-selector">
      <label for="lib-select">📚 词库选择：</label>
      <select id="lib-select" onchange="game.selectLibrary(this.value)">
        <option value="primary">🏫 小学</option>
        <option value="junior">📖 初中</option>
        <option value="senior">📚 高中</option>
        <option value="ket">🎯 KET</option>
        <option value="pet">🎯 PET</option>
        <option value="cet4">🎓 大学四级</option>
        <option value="cet6">🎓 大学六级</option>
        <option value="ielts">🌍 雅思</option>
        <option value="toefl">🌍 托福</option>
      </select>
    </div>
    <button class="btn btn-start" onclick="game.start()">🎮 开始冒险</button>
    <div style="margin-top:15px;color:#b2bec3;font-size:14px;">点击按钮或按任意键开始</div>
  </div>

  <!-- Game Screen -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <div class="header-item">
        <span class="icon">🏆</span>
        <span id="game-level">第1关</span>
      </div>
      <div class="header-item">
        <span class="icon">⭐</span>
        <span id="game-score">0</span>
      </div>
      <div class="hearts" id="game-hearts"></div>
      <div class="combo-display" id="combo-display">🔥 x1</div>
      <button class="pause-btn" id="pause-btn" onclick="game.togglePause()" title="暂停 (Esc)">⏸</button>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>
    <div class="game-area" id="game-area">
      <div class="character-area">🦊</div>
    </div>
    <div class="typing-area">
      <div class="typing-display" id="typing-display">
        <span class="remaining" id="display-text"></span>
        <span class="cursor">|</span>
      </div>
      <div class="hint-text" id="hint-text">⌨️ 点击上方彩色区域开始打字吧！单词输完自动提交~</div>
      <div class="keyboard" id="keyboard">
        <div class="keyboard-row" id="kb-row1"></div>
        <div class="keyboard-row" id="kb-row2"></div>
        <div class="keyboard-row" id="kb-row3"></div>

  buildWordLists() {
    const lib = this.wordBank[this.selectedLibrary];
    const raw = lib.words;
    const allWords = Array.isArray(raw) ? raw : raw.split(' ').filter(Boolean);
    // group by length
    const byLen = {};
    allWords.forEach(w => {
      const len = w.length;
      if (!byLen[len]) byLen[len] = [];
      if (!byLen[len].includes(w)) byLen[len].push(w);
    });
    // assign to levels: 1→3, 2→4, 3→5, 4→6, 5→7+
    const mapping = { 1: 3, 2: 4, 3: 5, 4: 6, 5: 7 };
    this.words = {};
    for (let lv = 1; lv <= 5; lv++) {
      const targetLen = mapping[lv];
      let pool = [];
      if (lv < 5) {
        pool = byLen[targetLen] || [];
        if (pool.length < 10) {
          for (let dl = 1; dl <= 3; dl++) {
            const shorter = byLen[targetLen - dl] || [];
            const longer = byLen[targetLen + dl] || [];
            pool = pool.concat(shorter.filter(w => !pool.includes(w)));
            pool = pool.concat(longer.filter(w => !pool.includes(w)));
          }
        }
      } else {
        // level 5: 7+ letters
        for (let len = 7; len <= 14; len++) {
          pool = pool.concat(byLen[len] || []);
        }
      }
      this.words[lv] = pool.length > 0 ? pool : allWords.slice(0, 20);
    }
  },

  selectLibrary(lib) {
    this.selectedLibrary = lib;
    this.buildWordLists();
  },

  lookupWord(word) {
    return this.wordDict[word] || null;
  },

  async fetchWordInfo(word) {
    if (this.wordDict[word]) return { p: this.wordDict[word].p, c: this.wordDict[word].c };
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 3000);
    try {
      const enc = encodeURIComponent(word);
      const [pRes, tRes] = await Promise.allSettled([
        fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + enc, { signal: controller.signal })
          .then(r => r.ok ? r.json() : Promise.reject()),
        fetch('https://api.mymemory.translated.net/get?q=' + enc + '&langpair=en|zh', { signal: controller.signal })
          .then(r => r.ok ? r.json() : Promise.reject())
      ]);
      clearTimeout(timeoutId);
      let p = null, c = null;
      if (pRes.status === 'fulfilled' && Array.isArray(pRes.value) && pRes.value[0]) {
        const d = pRes.value[0];
        p = d.phonetic || (d.phonetics && d.phonetics[0] && d.phonetics[0].text) || null;
      }
      if (tRes.status === 'fulfilled' && tRes.value && tRes.value.responseData && tRes.value.responseData.translatedText) {
        c = tRes.value.responseData.translatedText;
        if (c.toLowerCase() === word.toLowerCase()) c = null;
      }
      if (p || c) {
        this.wordDict[word] = { p: p || '', c: c || '' };
        return { p: p || '', c: c || '' };
      }
      return null;
    } catch (e) { clearTimeout(timeoutId); return null; }
  },

  prefetchLevelWords(level) {
    const list = this.words[level];
    if (!list || !list.length) return;
    const shuffled = [...list].sort(() => Math.random() - 0.5);
    const toFetch = shuffled.slice(0, 15).filter(w => !this.wordDict[w]);
    toFetch.forEach((word, i) => {
      setTimeout(() => this.fetchWordInfo(word), i * 200);
    });
  },

  speakWord(word) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    u.rate = 0.75;
    u.pitch = 1.1;
    window.speechSynthesis.speak(u);
  },

  togglePause() {
    if (this.screen !== 'game' && this.screen !== 'mini-game') return;
    this.isPaused = !this.isPaused;
    if (this.isPaused) {
      // show pause overlay on both game and mini-game screens
      const screenEl = document.getElementById('screen-' + this.screen);
      const overlay = document.createElement('div');
      overlay.id = 'pause-overlay';
      overlay.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;border-radius:25px;cursor:pointer;';
      overlay.innerHTML = '<div style="font-size:56px">⏸️</div><div style="font-size:24px;color:#fff;font-weight:bold;margin-top:8px;">暂停中 — 点击继续</div>';
      overlay.addEventListener('click', () => this.togglePause());
      screenEl.style.position = screenEl.style.position || 'relative';
      screenEl.appendChild(overlay);
      // blur hidden input so keystrokes don't leak through
      if (this.screen === 'game') this.dom.hiddenInput.blur();
      // update hint
      this.dom.hintText.textContent = '⏸️ 游戏已暂停，点击画面或按 Esc 继续';
    } else {
      const overlay = document.getElementById('pause-overlay');
      if (overlay) overlay.remove();
      this.dom.hintText.textContent = '⌨️ 点击上方彩色区域开始打字吧！单词输完自动提交~';
      if (this.screen === 'game') this.dom.hiddenInput.focus();
    }
  },

  levelConfig: {
    1: { name: '🌻 花园草地', wordsNeeded: 8, timeLimit: 14, emoji: '🐱' },
    2: { name: '🌲 魔法森林', wordsNeeded: 10, timeLimit: 12, emoji: '🐰' },
    3: { name: '🌊 海底世界', wordsNeeded: 10, timeLimit: 10, emoji: '🐬' },
    4: { name: '🚀 星空宇宙', wordsNeeded: 10, timeLimit: 9, emoji: '🦊' },
    5: { name: '🏰 终极城堡', wordsNeeded: 8, timeLimit: 8, emoji: '🦄' }
  },

  // dom refs
  dom: {},

  init() {
    this.buildWordLists();
    this.dom = {
      start: document.getElementById('screen-start'),
      game: document.getElementById('screen-game'),
      levelComplete: document.getElementById('screen-level-complete'),
      miniGame: document.getElementById('screen-mini-game'),
      victory: document.getElementById('screen-victory'),
      gameLevel: document.getElementById('game-level'),
      gameScore: document.getElementById('game-score'),
      gameHearts: document.getElementById('game-hearts'),
      comboDisplay: document.getElementById('combo-display'),
      progressBar: document.getElementById('progress-bar'),
      gameArea: document.getElementById('game-area'),
      typingDisplay: document.getElementById('typing-display'),
      displayText: document.getElementById('display-text'),
      hiddenInput: document.getElementById('hidden-input'),
      lcMessage: document.getElementById('lc-message'),
      lcStars: document.getElementById('lc-stars'),
      lcDetail: document.getElementById('lc-detail'),
      lcBtn: document.getElementById('lc-btn'),
      miniArea: document.getElementById('mini-area'),
      miniTimer: document.getElementById('mini-timer'),
      miniCaught: document.getElementById('mini-caught'),
      finalScore: document.getElementById('final-score'),
      hintText: document.getElementById('hint-text'),
      keyboard: document.getElementById('keyboard'),
      kbRows: [
        document.getElementById('kb-row1'),
        document.getElementById('kb-row2'),
        document.getElementById('kb-row3')
      ]
    };

    this.buildKeyboard();

    // global keyboard listener
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        this.togglePause();
        return;
      }
      if (this.isPaused) { e.preventDefault(); return; }
      if (this.screen === 'start' && e.key.length === 1) {
        this.start();
        return;
      }
      if (this.screen === 'game') {
        this.dom.hiddenInput.focus();
      }
      if (this.screen === 'mini-game') {
        this.handleMiniKey(e.key.toLowerCase());
      }
    });

    // click on game area to focus
    this.dom.gameArea.addEventListener('click', () => {
      if (this.screen === 'game') this.dom.hiddenInput.focus();
    });
    this.dom.typingDisplay.addEventListener('click', () => {
      if (this.screen === 'game') this.dom.hiddenInput.focus();
    });

    // hidden input handler
    this.dom.hiddenInput.addEventListener('input', (e) => {
      if (this.isPaused) return;
      if (this.screen !== 'game') return;
      const typed = e.target.value.toLowerCase().replace(/[^a-z]/g, '');
      // detect wrong key press
      const prevLen = this._prevTypedLen || 0;
      if (typed.length > prevLen && this.currentWord) {
        const newChar = typed[typed.length - 1];
        const expectedChar = this.currentWord[typed.length - 1];
        if (expectedChar && newChar !== expectedChar) {
          this.flashWrongKey(expectedChar);
        }
      }
      this._prevTypedLen = typed.length;
      e.target.value = typed;
      this.updateTypingDisplay(typed);
      this.checkWordMatch(typed);
    });

    // focus/blur for typing hint
    this.dom.hiddenInput.addEventListener('focus', () => {
      if (this.screen === 'game' && this.dom.hintText) {
        this.dom.hintText.textContent = '✨ 正在输入中...';
      }
    });
    this.dom.hiddenInput.addEventListener('blur', () => {
      if (this.dom.hintText) {
        this.dom.hintText.textContent = '👆 点击上方彩色区域开始打字吧！单词输完自动提交~';
      }
    });
  },

  // ─── On-screen Keyboard ────────────────────────
  kbLayout: [
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    ['z','x','c','v','b','n','m']
  ],

  buildKeyboard() {
    this.kbKeys = {};
    this.kbLayout.forEach((row, ri) => {
      const rowEl = this.dom.kbRows[ri];
      if (!rowEl) return;
      rowEl.innerHTML = '';
      row.forEach(letter => {
        const key = document.createElement('div');
        key.className = 'key';
        key.textContent = letter;
        key.dataset.letter = letter;
        this.kbKeys[letter] = key;
        rowEl.appendChild(key);
      });
    });
  },

  updateKeyboard(typed) {
    // reset all keys
    Object.values(this.kbKeys).forEach(k => {
      k.className = 'key';
    });

    const target = this.currentWord;
    if (!target) return;

    for (let i = 0; i < target.length; i++) {
      const letter = target[i];
      const key = this.kbKeys[letter];
      if (!key) continue;

      if (i < typed.length) {
        if (typed[i] === target[i]) {
          key.classList.add('correct');
        } else {
          // wrong letter at this position - don't mark it correct
        }
      }

      // the next untyped letter is the "target" to highlight
      if (i === typed.length) {
        key.classList.add('highlight');
        break; // only highlight the next one
      }
    }
  },

  flashWrongKey(letter) {
    const key = this.kbKeys[letter];
    if (!key) return;
    key.classList.add('wrong-flash');
    setTimeout(() => {
      if (key.classList.contains('wrong-flash')) {
        key.classList.remove('wrong-flash');
        this.updateKeyboard(this.dom.hiddenInput.value);
      }
    }, 300);
  },

  showScreen(name) {
    Object.values(this.dom).forEach(el => {
      if (el && el.classList) el.classList.remove('active');
    });
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const map = {
      'start': this.dom.start,
      'game': this.dom.game,
      'level-complete': this.dom.levelComplete,
      'mini-game': this.dom.miniGame,
      'victory': this.dom.victory
    };
    if (map[name]) map[name].classList.add('active');
    this.screen = name;
  },

  start() {
    this.level = 1;
    this.totalScore = 0;
    this.showScreen('game');
    this.startLevel(1);
  },

  startLevel(lvl) {
    clearInterval(this.timerInterval);
    this.level = lvl;
    const cfg = this.levelConfig[lvl];
    this.score = 0;
    this.lives = this.maxLives;
    this.wordsCleared = 0;
    this.wordsNeeded = cfg.wordsNeeded;
    this.combo = 0;
    this.maxCombo = 0;
    this.currentWord = '';

    this.dom.gameLevel.textContent = `第${lvl}关 ${cfg.name}`;
    this.dom.gameScore.textContent = '0';
    this.dom.progressBar.style.width = '0%';
    this.dom.comboDisplay.classList.remove('show');
    this.updateHearts();
    this.updateTypingDisplay('');
    this.dom.hiddenInput.value = '';
    this.dom.hiddenInput.focus();
    this.prefetchLevelWords(lvl);

    // update character
    const charEl = this.dom.gameArea.querySelector('.character-area');
    if (charEl) charEl.textContent = cfg.emoji;

    // clear old bubbles
    this.dom.gameArea.querySelectorAll('.word-bubble').forEach(b => b.remove());

    // spawn first word after short delay
    setTimeout(() => this.spawnWord(), 400);
  },

  spawnWord() {
    if (this.screen !== 'game') return;
    if (this.wordsCleared >= this.wordsNeeded) {
      this.completeLevel();
      return;
    }

    // pick random word
    const list = this.words[this.level];
    let word;
    do {
      word = list[Math.floor(Math.random() * list.length)];
    } while (word === this.currentWord && list.length > 1);
    this.currentWord = word;
    this._prevTypedLen = 0;
    this.updateKeyboard('');

    // pronounce & lookup
    this.speakWord(word);
    const info = this.lookupWord(word);

    // clear old bubble
    this.dom.gameArea.querySelectorAll('.word-bubble').forEach(b => b.remove());

    // create bubble
    const area = this.dom.gameArea;
    const areaW = area.clientWidth;
    const areaH = area.clientHeight;
    const bubbleSize = Math.min(190, areaW * 0.45);
    const x = Math.random() * (areaW - bubbleSize - 20) + 10;
    const y = Math.random() * (areaH - bubbleSize - 80) + 30;

    const bubble = document.createElement('div');
    bubble.className = 'word-bubble';
    bubble.style.cssText = `
      left: ${x}px;
      top: ${y}px;
      width: ${bubbleSize}px;
      height: ${bubbleSize}px;
    `;
    const phoneticText = info ? info.p : '';
    const chineseText = info ? info.c : '';
    const phoneticHTML = `<span class="bubble-phonetic" style="font-size:${bubbleSize * 0.11}px">${phoneticText}</span>`;
    const chineseHTML = `<span class="bubble-chinese" style="font-size:${bubbleSize * 0.1}px">${chineseText}</span>`;
    bubble.innerHTML = `
      <span class="bubble-word" style="font-size:${bubbleSize * 0.22}px">${word}</span>
      ${phoneticHTML}
      ${chineseHTML}
      <button class="bubble-speaker" style="width:${bubbleSize * 0.2}px;height:${bubbleSize * 0.2}px;font-size:${bubbleSize * 0.12}px" title="再读一次">🔊</button>
      <div class="timer-ring">
        <div class="timer-ring-fill" style="width:100%"></div>
      </div>
    `;

    // speaker button click handler
    bubble.querySelector('.bubble-speaker').addEventListener('click', (e) => {
      e.stopPropagation();
      this.speakWord(this.currentWord);
    });

    area.appendChild(bubble);

    // async fetch to fill in missing phonetic/translation
    const _fetchWord = word;
    this.fetchWordInfo(_fetchWord).then(fetchedInfo => {
      if (!fetchedInfo) return;
      if (this.currentWord !== _fetchWord) return;
      const b = this.dom.gameArea.querySelector('.word-bubble');
      if (!b) return;
      const pSpan = b.querySelector('.bubble-phonetic');
      const cSpan = b.querySelector('.bubble-chinese');
      if (pSpan && fetchedInfo.p) pSpan.textContent = fetchedInfo.p;
      if (cSpan && fetchedInfo.c) cSpan.textContent = fetchedInfo.c;
    });

    // reset input
    this.dom.hiddenInput.value = '';
    this.updateTypingDisplay('');

    // start timer
    const cfg = this.levelConfig[this.level];
    this.wordTimeLimit = cfg.timeLimit;
    this.wordTimer = this.wordTimeLimit;
    const timerFill = bubble.querySelector('.timer-ring-fill');

    if (this.timerInterval) clearInterval(this.timerInterval);
    this.timerInterval = setInterval(() => {
      if (this.isPaused) return;
      this.wordTimer -= 0.1;
      const pct = Math.max(0, (this.wordTimer / this.wordTimeLimit) * 100);
      if (timerFill) timerFill.style.width = pct + '%';
      if (pct < 30) {
        timerFill.style.background = '#ff6b6b';
      } else if (pct < 60) {
        timerFill.style.background = 'linear-gradient(90deg, #feca57, #ff6b6b)';
      }

      if (this.wordTimer <= 0) {
        clearInterval(this.timerInterval);
        this.onWordTimeout(bubble);
      }
    }, 100);

    this.dom.hiddenInput.focus();
  },

  updateTypingDisplay(typed) {
    this.updateKeyboard(typed);
    const target = this.currentWord;
    let html = '';
    for (let i = 0; i < target.length; i++) {
      if (i < typed.length) {
        if (typed[i] === target[i]) {
          html += `<span class="typed">${target[i]}</span>`;
        } else {
          html += `<span style="color:#ff6b6b">${target[i]}</span>`;
        }
      } else {
        html += `<span class="remaining">${target[i]}</span>`;
      }
    }
    html += '<span class="cursor">|</span>';
    this.dom.displayText.innerHTML = html || '<span class="remaining">等待输入...</span><span class="cursor">|</span>';
  },

  checkWordMatch(typed) {
    if (!this.currentWord) return;
    if (typed === this.currentWord) {
      this.onWordCorrect();
    }
  },

  onWordCorrect() {
    clearInterval(this.timerInterval);
    this.combo++;
    if (this.combo > this.maxCombo) this.maxCombo = this.combo;

    // combo display
    if (this.combo >= 2) {
      this.dom.comboDisplay.textContent = '🔥 x' + this.combo;
      this.dom.comboDisplay.classList.add('show');
      this.dom.comboDisplay.style.animation = 'none';
      void this.dom.comboDisplay.offsetWidth;
      this.dom.comboDisplay.style.animation = 'comboBounce 0.3s ease';
    }

    // calculate points
    const basePoints = this.currentWord.length * 10;
    const comboMult = Math.min(this.combo, 10);
    const points = basePoints * comboMult * this.level;
    this.score += points;
    this.totalScore += points;
    this.wordsCleared++;

    // update UI
    this.dom.gameScore.textContent = this.score;
    const progressPct = (this.wordsCleared / this.wordsNeeded) * 100;
    this.dom.progressBar.style.width = progressPct + '%';

    // pop animation
    const bubble = this.dom.gameArea.querySelector('.word-bubble');
    if (bubble) {
      bubble.classList.add('pop');
      const rect = bubble.getBoundingClientRect();
      const appRect = document.getElementById('app').getBoundingClientRect();
      const cx = rect.left + rect.width / 2 - appRect.left;
      const cy = rect.top + rect.height / 2 - appRect.top;
      this.createParticles(cx, cy, '#feca57');
      this.createParticles(cx, cy, '#ff9ff3');
      this.createParticles(cx, cy, '#48dbfb');
      this.createFloatScore(cx, cy - 30, '+' + points);

      setTimeout(() => {
        bubble.remove();
        this.currentWord = '';
        this.dom.hiddenInput.value = '';
        this.updateTypingDisplay('');
        setTimeout(() => this.spawnWord(), 350);
      }, 400);
    }
  },

  onWordTimeout(bubble) {
    clearInterval(this.timerInterval);
    this.combo = 0;
    this.dom.comboDisplay.classList.remove('show');
    this.lives--;
    this.updateHearts();

    if (bubble) {
      bubble.classList.add('timeout');
      setTimeout(() => bubble.remove(), 500);
    }

    if (this.lives <= 0) {
      // restart level
      this.createConfetti(false);
      const levelMsg = document.createElement('div');
      levelMsg.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;color:#ff6b6b;font-weight:bold;z-index:25;pointer-events:none;text-align:center;';
      levelMsg.innerHTML = '😢 没命了！<br><span style="font-size:20px">再试一次~</span>';
      this.dom.gameArea.appendChild(levelMsg);
      setTimeout(() => {
        levelMsg.remove();
        this.startLevel(this.level);
      }, 2000);
      return;
    }

    // spawn next word
    this.currentWord = '';
    this.dom.hiddenInput.value = '';
    this.updateTypingDisplay('');
    setTimeout(() => this.spawnWord(), 500);
  },

  updateHearts() {
    let html = '';
    for (let i = 0; i < this.maxLives; i++) {
      html += `<span class="heart${i >= this.lives ? ' lost' : ''}">❤️</span>`;
    }
    this.dom.gameHearts.innerHTML = html;
  },

  completeLevel() {
    clearInterval(this.timerInterval);
    this.dom.gameArea.querySelectorAll('.word-bubble').forEach(b => b.remove());

    // calculate stars (1-3)
    const cfg = this.levelConfig[this.level];
    const timeBonus = this.combo >= 3 ? 1 : 0;
    const perfectBonus = this.lives === this.maxLives ? 1 : 0;
    const stars = 1 + timeBonus + perfectBonus;

    this.totalScore += this.score;

    this.showScreen('level-complete');
    this.dom.lcMessage.textContent = ['', '继续加油！', '非常棒！', '完美通关！'][stars];

    let starsHtml = '';
    for (let i = 0; i < 3; i++) {
      starsHtml += `<span class="star">${i < stars ? '⭐' : '☆'}</span>`;
    }
    this.dom.lcStars.innerHTML = starsHtml;
    this.dom.lcDetail.textContent = `第${this.level}关完成 | 得分: ${this.score} | 最大连击: x${this.maxCombo}`;

    if (this.level >= 5) {
      this.dom.lcBtn.textContent = '🏆 查看结果';
      this.dom.lcBtn.onclick = () => this.showVictory();
    } else if (this.bonusLevels.includes(this.level)) {
      this.dom.lcBtn.textContent = '🌟 进入奖励关卡';
      this.dom.lcBtn.onclick = () => this.startMiniGame();
    } else {
      this.dom.lcBtn.textContent = '▶ 下一关';
      this.dom.lcBtn.onclick = () => this.nextLevel();
    }

    this.createConfetti(true);
  },

  nextLevel() {
    this.level++;
    this.showScreen('game');
    this.startLevel(this.level);
  },

  // ─── Mini Game: Star Catching ─────────────────
  startMiniGame() {
    this.showScreen('mini-game');
    this.miniGameActive = true;
    this.miniTimer = 20;
    this.miniCaught = 0;
    this.dom.miniTimer.textContent = '20';
    this.dom.miniCaught.textContent = '0';
    this.dom.miniArea.innerHTML = '';

    // countdown
    this.miniInterval = setInterval(() => {
      if (this.isPaused) return;
      this.miniTimer--;
      this.dom.miniTimer.textContent = this.miniTimer;
      if (this.miniTimer <= 0) {
        this.endMiniGame();
      }
    }, 1000);

    // spawn stars
    this.spawnMiniStar();
    this.miniSpawnInterval = setInterval(() => {
      if (this.isPaused) return;
      if (this.miniGameActive) this.spawnMiniStar();
    }, 800);
  },

  spawnMiniStar() {
    if (!this.miniGameActive) return;
    const area = this.dom.miniArea;
    const letters = 'abcdefghijklmnopqrstuvwxyz';
    const letter = letters[Math.floor(Math.random() * letters.length)];
    const x = Math.random() * (area.clientWidth - 40);
    const duration = 5 + Math.random() * 4;

    const star = document.createElement('div');
    star.className = 'mini-star';
    star.textContent = letter;
    star.style.left = x + 'px';
    star.style.top = '-40px';
    star.style.animationDuration = duration + 's';
    star.dataset.letter = letter;
    area.appendChild(star);

    // remove when animation ends
    setTimeout(() => {
      if (star.parentNode) star.remove();
    }, duration * 1000);
  },

  handleMiniKey(key) {
    if (!this.miniGameActive || key.length !== 1 || !/[a-z]/.test(key)) return;

    const stars = this.dom.miniArea.querySelectorAll('.mini-star');
    for (const star of stars) {
      if (star.dataset.letter === key && !star.classList.contains('caught')) {
        star.classList.add('caught');
        this.miniCaught++;
        this.dom.miniCaught.textContent = this.miniCaught;

        // bonus points animation
        const rect = star.getBoundingClientRect();
        const appRect = document.getElementById('app').getBoundingClientRect();
        const cx = rect.left + rect.width / 2 - appRect.left;
        const cy = rect.top - appRect.top;
        this.createFloatScore(cx, cy, '+5');

        setTimeout(() => { if (star.parentNode) star.remove(); }, 300);
        return;
      }
    }
  },

  endMiniGame() {
    this.miniGameActive = false;
    clearInterval(this.miniInterval);
    clearInterval(this.miniSpawnInterval);
    this.dom.miniArea.querySelectorAll('.mini-star').forEach(s => s.remove());

    const bonusPoints = this.miniCaught * 5;
    this.totalScore += bonusPoints;

    // show result briefly then go to next level
    this.dom.miniTimer.textContent = '完成!';
    const msg = document.createElement('div');
    msg.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#feca57;font-size:40px;font-weight:bold;z-index:30;pointer-events:none;text-align:center;';
    msg.innerHTML = `✨ +${bonusPoints} 奖励分!`;
    this.dom.miniArea.appendChild(msg);

    setTimeout(() => {
      this.level++;
      this.showScreen('game');
      this.startLevel(this.level);
    }, 2000);
  },

  // ─── Victory ──────────────────────────────────
  showVictory() {
    this.showScreen('victory');
    this.dom.finalScore.textContent = this.totalScore;
    this.createConfetti(true);
  },

  restart() {
    this.level = 1;
    this.totalScore = 0;
    this.showScreen('game');
    this.startLevel(1);
  },

  // ─── Effects ──────────────────────────────────
  createParticles(x, y, color) {
    const container = document.getElementById('app');
    for (let i = 0; i < 8; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (Math.PI * 2 * i) / 8;
      const dist = 30 + Math.random() * 40;
      p.style.cssText = `
        left: ${x}px;
        top: ${y}px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: ${color};
        --dx: ${Math.cos(angle) * dist}px;
        --dy: ${Math.sin(angle) * dist}px;
      `;
      container.appendChild(p);
      setTimeout(() => p.remove(), 800);
    }
  },

  createFloatScore(x, y, text) {
    const container = document.getElementById('app');
    const el = document.createElement('div');
    el.className = 'float-score';
    el.style.cssText = `left:${x}px;top:${y}px;`;
    el.textContent = text;
    container.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  },

  createConfetti(big) {
    const container = document.getElementById('app');
    const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#00d2d3','#ff6348','#7bed9f','#e056a0'];
    const count = big ? 60 : 20;
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.cssText = `
          left: ${Math.random() * 100}%;
          top: -20px;
          background: ${colors[Math.floor(Math.random() * colors.length)]};
          width: ${8 + Math.random() * 12}px;
          height: ${6 + Math.random() * 10}px;
          border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
          animation-duration: ${2 + Math.random() * 3}s;
          animation-delay: ${Math.random() * 0.5}s;
        `;
        container.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }, i * 30);
    }
  }
};

// ─── Boot ────────────────────────────────────────
game.init();
</script>
